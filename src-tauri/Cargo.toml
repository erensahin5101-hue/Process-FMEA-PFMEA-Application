[package]
name = "tyana-qflow-desktop"
version = "1.0.0"
description = "TYANA OTOMOTİV kalite dokümantasyonu masaüstü uygulaması"
authors = ["TYANA OTOMOTİV", "Eren"]
edition = "2021"
rust-version = "1.97.0"

[lib]
name = "tyana_quality_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
sha2 = "0.10.8"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
