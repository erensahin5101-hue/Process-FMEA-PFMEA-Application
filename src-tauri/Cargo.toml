[package]
name = "tyana-quality-docs"
version = "0.1.0"
description = "TYANA OTOMOTİV kalite dokümantasyonu masaüstü uygulaması"
authors = ["Eren"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tyana_quality_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
